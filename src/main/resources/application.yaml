spring:
  application:
    name: logistics_shield
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics_db
    username: myuser
    password: mypassword

  #flyway magration
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true #spring turn on this, but for looks
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate